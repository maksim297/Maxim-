
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --max-workers=2 --console=plain

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: berserkofgluttony-jar
          path: build/libs/*.jar
          if-no-files-found: error
          
