name: Check Mod Build

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Install Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Build mod
    run: ./gradlew build --no-daemon --max-workers=2 --console=plain
- name: Save mod JAR
uses: actions/upload-artifact@v4
with:
name: berserkofgluttony-jar
path: build/libs/*.jar
if-no-files-found: error
